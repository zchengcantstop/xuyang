<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>徐杨是个大美女 · 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #12021a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #hud {
    padding: 10px 0;
    font-size: 15px;
    letter-spacing: 1px;
    color: #ffd166;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    border-radius: 14px;
    background: #1c0629;
    border: 1px solid rgba(255,255,255,.12);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    text-align: center;
    background: rgba(18,2,26,.88);
    border-radius: 14px;
  }
  #overlay.show { display: flex; }
  #title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff5fa2, #ffd166, #5ff0d0, #a06bff, #ff5fa2);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: flow 3s linear infinite;
  }
  @keyframes flow { to { background-position: -300% 0; } }
  #sub { font-size: 14px; color: #cbb8d8; line-height: 1.6; }
  #bar {
    display: flex;
    gap: 10px;
    padding: 10px 14px 0;
    width: 100%;
    max-width: 420px;
  }
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 300px;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
  }
  #pad button {
    font-size: 22px;
    padding: 16px 0;
    background: linear-gradient(135deg, #3a1350, #23083a);
    border: 1px solid rgba(255,255,255,.14);
  }
  #pad .up    { grid-column: 2; grid-row: 1; }
  #pad .left  { grid-column: 1; grid-row: 2; }
  #pad .down  { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }
  button {
    flex: 1;
    padding: 13px 0;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff5fa2, #a06bff);
  }
  button:active { transform: scale(.96); opacity: .85; }
</style>
</head>
<body>
  <div id="hud">徐杨 + <span id="score">0</span> / 5 字 · 吃齐「是个大美女」</div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="title"></div>
      <div id="sub"></div>
      <button id="again" style="max-width:180px">再来一局</button>
    </div>
  </div>
  <div id="bar">
    <button id="toggle">暂停</button>
    <button id="restart">重开</button>
  </div>
  <div id="pad">
    <button class="up"    data-dir="0,-1">▲</button>
    <button class="left"  data-dir="-1,0">◀</button>
    <button class="down"  data-dir="0,1">▼</button>
    <button class="right" data-dir="1,0">▶</button>
  </div>

<script>
  const HEAD_TEXT = '徐杨';
  const FOOD_CHARS = '是个大美女'.split('');
  const TEXT = HEAD_TEXT + FOOD_CHARS.join('');
  const GOAL = FOOD_CHARS.length;
  const COLS = 9, ROWS = 11;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const toggleBtn = document.getElementById('toggle');
  const againBtn = document.getElementById('again');

  let cell = 22;
  function fit() {
    const maxW = Math.min(window.innerWidth - 24, 420);
    const maxH = window.innerHeight - 260;
    cell = Math.max(12, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    const dpr = window.devicePixelRatio || 1;
    cv.width = COLS * cell * dpr;
    cv.height = ROWS * cell * dpr;
    cv.style.width = COLS * cell + 'px';
    cv.style.height = ROWS * cell + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  let snake, dir, nextDir, food, score, timer, over;

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    const spot = free[Math.floor(Math.random() * free.length)];
    food = { ...spot, char: FOOD_CHARS[score] };
  }

  function resetState() {
    snake = [{ x: 4, y: 6 }, { x: 4, y: 7 }];
    dir = { x: 0, y: -1 };
    nextDir = dir;
    score = 0;
    over = false;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function prepare() {
    stop();
    resetState();
    titleEl.textContent = TEXT;
    subEl.innerHTML = `吃齐「是个大美女」5 个字<br>集齐即胜利结算`;
    againBtn.textContent = '开始游戏';
    overlay.classList.add('show');
    toggleBtn.textContent = '暂停';
    draw();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return finish(false);
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score >= GOAL) { draw(); return finish(true); }
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function finish(win) {
    over = true;
    stop();
    toggleBtn.textContent = '暂停';
    titleEl.textContent = win ? TEXT : '撞到啦';
    subEl.innerHTML = win
      ? `集齐 ${GOAL} 个字，胜利结算！<br>${TEXT}！`
      : `只吃到 ${score} 个，再试一次吧`;
    againBtn.textContent = '再来一局';
    overlay.classList.add('show');
  }

  function draw() {
    const w = COLS * cell, h = ROWS * cell;
    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, h); ctx.stroke();
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(w, y * cell); ctx.stroke();
    }

    ctx.font = `700 ${Math.floor(cell * 0.72)}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (food) {
      ctx.save();
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = cell * 0.4;
      ctx.fillStyle = '#ffd166';
      ctx.fillText(food.char, food.x * cell + cell / 2, food.y * cell + cell / 2 + 1);
      ctx.restore();
    }

    snake.forEach((s, i) => {
      const cx = s.x * cell + cell / 2, cy = s.y * cell + cell / 2;
      const p = Math.max(1, Math.floor(cell * 0.08));
      const r = Math.floor(cell * 0.28);
      ctx.fillStyle = i === 0 ? 'rgba(255,95,162,.35)' : 'rgba(160,107,255,.22)';
      ctx.beginPath();
      const x = s.x * cell + p, y = s.y * cell + p, sz = cell - p * 2;
      ctx.roundRect ? ctx.roundRect(x, y, sz, sz, r) : ctx.rect(x, y, sz, sz);
      ctx.fill();

      ctx.fillStyle = i === 0 ? '#ff5fa2' : '#ffffff';
      ctx.fillText(TEXT[i] || '·', cx, cy + 1);
    });
  }

  function start() {
    if (timer || over) return;
    timer = setInterval(step, 320);
    toggleBtn.textContent = '暂停';
  }
  function stop() {
    clearInterval(timer);
    timer = null;
    toggleBtn.textContent = '继续';
  }

  function turn(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    if (dir.x === x && dir.y === y) return;
    nextDir = { x, y };
  }

  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };
  window.addEventListener('keydown', e => {
    const k = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
    else if (e.key === ' ') {
      e.preventDefault();
      if (overlay.classList.contains('show')) againBtn.click();
      else timer ? stop() : start();
    }
  });

  let sx = 0, sy = 0;
  cv.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.querySelectorAll('#pad button').forEach(btn => {
    const [x, y] = btn.dataset.dir.split(',').map(Number);
    const act = e => { e.preventDefault(); turn(x, y); };
    btn.addEventListener('touchstart', act);
    btn.addEventListener('click', act);
  });

  toggleBtn.onclick = () => { if (!over && !overlay.classList.contains('show')) timer ? stop() : start(); };
  document.getElementById('restart').onclick = prepare;
  againBtn.onclick = () => {
    if (over) resetState();
    overlay.classList.remove('show');
    start();
  };
  window.addEventListener('resize', fit);

  fit();
  prepare();
</script>
</body>
</html>
